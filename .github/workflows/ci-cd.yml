name: Django CI/CD Pipeline (SQLite - Development)

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DEBUG: True
          SECRET_KEY: test-secret-key
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        env:
          DEBUG: True
          SECRET_KEY: test-secret-key
        run: |
          python manage.py test --verbosity=2

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/django-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/django-backend:${{ github.sha }}

      # Confirmation message
      - name: Image digest
        run: echo "Docker image pushed successfully!"


        # End of workflow file
