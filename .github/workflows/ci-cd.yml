name: Django CI/CD Pipeline (SQLite)

# Trigger workflow on push or pull_request to development branch
on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  # Job 1: Test (migrations + unit tests)

  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run migrations (SQLite does not need DB credentials)
      - name: Run migrations
        env:
          DEBUG: True
          SECRET_KEY: test-secret-key-12345
        run: |
          python manage.py migrate --noinput

      # Run Django tests
      - name: Run tests
        env:
          DEBUG: True
          SECRET_KEY: test-secret-key-12345
        run: |
          python manage.py test --verbosity=2


  # Job 2: Build and Push Docker Image (CD)

  build-and-push:
    runs-on: ubuntu-latest
    needs: test  # Only run if test job passes
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    
    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/django-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/django-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/django-backend:latest
          cache-to: type=inline

      # Confirmation message
      - name: Image digest
        run: echo "Docker image pushed successfully!"
